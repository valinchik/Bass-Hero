name: Build Bass Hero APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.webmanifest sw.js www/
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          missing = [permission for permission in permissions if permission.split('"')[1] not in s]
          if missing:
              end = s.find(">", s.find("<manifest")) + 1
              s = s[:end] + "\n" + "\n".join(missing) + s[end:]
              p.write_text(s)
          PY
      - name: Sync web app
        run: npx cap sync android
      - name: Check JavaScript syntax
        run: node --check www/app.js
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bass-Hero-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

